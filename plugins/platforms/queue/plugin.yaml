name: queue-platform
label: Queue
kind: platform
version: 1.1.0
description: >
  Queue gateway adapter for Hermes Agent. queue.v1 keeps the existing local or
  HTTP inbox/outbox flow. conversation.v1 uses the canonical conversation
  ledger, per-agent credentials, delivery receipts, and active-token fencing.
author: charde023
requires_env:
  - name: QUEUE_AGENT
    description: "Claim target name in the queue (e.g. chami)"
    prompt: "Queue agent (claim target)"
    password: false
  - name: QUEUE_REPO_ROOT
    description: "slack_agent repo root providing the bridge package"
    prompt: "slack_agent repo root"
    password: false
optional_env:
  - name: QUEUE_PROTOCOL_VERSION
    description: "Queue protocol: queue.v1 (default) or conversation.v1"
    prompt: "Queue protocol version"
    password: false
  - name: QUEUE_DB_PATH
    description: "queue.v1 local SQLite path; required when QUEUE_ENDPOINT is absent"
    prompt: "Queue SQLite DB path"
    password: false
  - name: QUEUE_ENDPOINT
    description: "Queue HTTP endpoint; required for conversation.v1"
    prompt: "Queue endpoint"
    password: false
  - name: QUEUE_TOKEN
    description: "Legacy queue.v1 shared HTTP token"
    prompt: "Legacy queue token"
    password: true
  - name: QUEUE_CONVERSATION_CREDENTIAL
    description: "Dedicated per-agent credential required for conversation.v1"
    prompt: "Conversation agent credential"
    password: true
  - name: QUEUE_POLL_INTERVAL
    description: "Polling interval in seconds (default 2.0)"
    prompt: "Poll interval (seconds)"
    password: false
  - name: QUEUE_ALLOWED_SENDERS
    description: "Comma-separated Slack user IDs allowed to reach the agent"
    prompt: "Allowed senders (comma-separated)"
    password: false
  - name: QUEUE_ALLOW_ALL_USERS
    description: "Set truthy to allow all senders (overrides the default-deny core authz)"
    prompt: "Allow all senders (true/false)"
    password: false
